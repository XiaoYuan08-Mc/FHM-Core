name: Bug 报告
description: 功能不对、行为异常，但服务端还能跑
body:
  - type: markdown
    attributes:
      value: |
        提之前先确认两件事：用的是最新编出来的 jar；`/version` 输出的版本串是 `26.3-DEV-...` 开头的。
  - type: dropdown
    id: flavor
    attributes:
      label: 用的是哪个档
      description: 只打 Leaf 的档能帮你判断是不是 Gale 那部分的锅
      options:
        - Leaf + Gale（FHM-Core-26.3.jar）
        - 只有 Leaf
        - 不确定
    validations:
      required: true
  - type: textarea
    attributes:
      label: /version 输出
      description: 直接在控制台跑 `/version`，把整段粘进来，别截图
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: 插件列表
      description: 用 `/plugins`，或者贴 plugins 目录的文件名
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: 怎么复现
      description: 步骤、用的图、坐标、命令都写清楚，越具体越好排查
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望的结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际的结果
    validations:
      required: true
  - type: dropdown
    id: vanilla_check
    attributes:
      label: 原版 Purpur 26.3 上也会这样吗
      description: 手上有原版 jar 的话试一下，这一步能省掉很多来回
      options:
        - 没试过
        - 会，原版也一样
        - 不会，只有集成档会
