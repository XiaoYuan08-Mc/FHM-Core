name: 性能问题
description: TPS 低、MSPT 高、卡顿、内存涨得不正常
body:
  - type: markdown
    attributes:
      value: |
        先说清楚一点：这个仓库目前**没有公开 TPS 基准数据**，只有启动和稳定性验证。所以「感觉变快了/变慢了」这种描述没法处理，得给数字。
  - type: dropdown
    id: flavor
    attributes:
      label: 用的是哪个档
      options:
        - Leaf + Gale（FHM-Core-26.3.jar）
        - 只有 Leaf
        - 不确定
    validations:
      required: true
  - type: textarea
    attributes:
      label: 具体数值
      description: TPS、MSPT（`/tps`、`/mspt`、spark 的 tick 统计任意一个都行），加上采样时长和在线人数
      render: text
    validations:
      required: true
  - type: input
    attributes:
      label: spark 链接
      description: `/spark profiler --timeout 300` 的输出链接，要链接不要截图
    validations:
      required: true
  - type: textarea
    attributes:
      label: 硬件和开服参数
      description: CPU 型号、内存大小、分配的 `-Xmx`、启动附加参数、用的什么 GC
      render: text
    validations:
      required: true
  - type: dropdown
    id: compare
    attributes:
      label: 和原版 Purpur 26.3 比过吗
      options:
        - 比过，原版更稳
        - 比过，集成档更稳
        - 比过，差不多
        - 没比过
    validations:
      required: true
  - type: textarea
    attributes:
      label: 现象补充
      description: 是哪个维度有问题——区块加载、实体 tick、网络延迟、GC 停顿，能定位到大致方向就写上
