name: 崩溃 / 堆栈报错
description: 服务端起不来，或者跑着跑着抛异常退出
body:
  - type: markdown
    attributes:
      value: |
        日志里出现 `DO NOT REPORT THIS TO PURPUR` 这类提示的不是崩溃，那是 TPS 告警，别按崩溃提。

        贴堆栈要贴完整，别截取中间一段，也别发截图。
  - type: dropdown
    id: flavor
    attributes:
      label: 用的是哪个档
      options:
        - Leaf + Gale（FHM-Core-26.3.jar）
        - 只有 Leaf
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 崩在哪个阶段
      options:
        - 启动中，还没到 Done
        - Done 之后跑一段时间崩
        - 关服时崩
        - 重启 / reload 时崩
    validations:
      required: true
  - type: textarea
    attributes:
      label: 完整堆栈
      description: 从 `Exception` / `Error` 那行开始，到 `Caused by` 链结束，全贴
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最近动过什么
      description: 新装的插件、改过的配置、换过的图、加过的 Mod 端协议，按时间顺序写
    validations:
      required: true
  - type: textarea
    attributes:
      label: latest.log 尾部
      description: 崩之前 100 行左右，贴文本不要发附件
      render: text
  - type: input
    attributes:
      label: spark 链接（可选）
      description: 跑过 `/spark profiler --timeout 300` 的话把链接放这
